<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Session Compass. Six Claude Code sessions open. Which is which?">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b10"/>
      <stop offset="1" stop-color="#0d1320"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff88"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4dffa8"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffa347"/>
    </linearGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowO" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a1f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonSoft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bar" x="-5%" y="-300%" width="110%" height="700%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="card"><rect width="1280" height="360" rx="20"/></clipPath>
    <style>
      text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .needle { transform-origin: 200px 180px; animation: swing 6s ease-in-out infinite; }
      @keyframes swing {
        0%   { transform: rotate(-70deg); }
        18%  { transform: rotate(25deg); }
        26%  { transform: rotate(8deg); }
        34%  { transform: rotate(18deg); }
        100% { transform: rotate(18deg); }
      }
      .ring { transform-origin: 200px 180px; animation: spin 40s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .pill { opacity: 0; animation: rise 0.6s ease-out forwards; }
      .p1 { animation-delay: 0.6s; } .p2 { animation-delay: 1.0s; } .p3 { animation-delay: 1.4s; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .dot-run { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.3; } }
      .hum { animation: hum 4s ease-in-out infinite; }
      @keyframes hum { 50% { opacity: 0.65; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <circle cx="200" cy="180" r="260" fill="url(#glowG)"/>
    <circle cx="1120" cy="300" r="380" fill="url(#glowO)"/>

    <!-- compass -->
    <g class="ring" fill="none" stroke="#00ff88" stroke-opacity="0.8" stroke-width="2" filter="url(#neonSoft)">
      <circle cx="200" cy="180" r="122" stroke-dasharray="3 12" stroke-linecap="round"/>
    </g>
    <circle cx="200" cy="180" r="100" fill="#0a1018" stroke="url(#tri)" stroke-width="4" filter="url(#neonSoft)"/>
    <g stroke="#e8fff4" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9">
      <line x1="200" y1="92" x2="200" y2="106"/><line x1="200" y1="254" x2="200" y2="268"/>
      <line x1="112" y1="180" x2="126" y2="180"/><line x1="274" y1="180" x2="288" y2="180"/>
    </g>
    <g class="needle" filter="url(#neonSoft)">
      <path d="M200 112 L218 180 L200 188 L182 180 Z" fill="#ff8a1f"/>
      <path d="M200 248 L218 180 L200 188 L182 180 Z" fill="#00ff88"/>
    </g>
    <circle cx="200" cy="180" r="7" fill="#070b10" stroke="#ffffff" stroke-width="3"/>

    <!-- title -->
    <text x="400" y="150" font-size="84" font-weight="800" fill="url(#title)" letter-spacing="-2" filter="url(#neon)">Session Compass</text>
    <text x="404" y="204" font-size="30" font-weight="400" fill="#a9b6c9">Six Claude Code sessions open. Which is which?</text>

    <!-- status pills -->
    <g class="pill p1">
      <rect x="404" y="244" width="250" height="52" rx="26" fill="#10161f" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.5" filter="url(#neonSoft)"/>
      <circle class="dot-run" cx="432" cy="270" r="7" fill="#ffffff" filter="url(#neonSoft)"/>
      <text x="450" y="278" font-size="22" font-weight="600" fill="#f2f6ff">mid-refactor</text>
    </g>
    <g class="pill p2">
      <rect x="672" y="244" width="250" height="52" rx="26" fill="#1a130b" stroke="#ff8a1f" stroke-width="1.5" filter="url(#neonSoft)"/>
      <circle cx="700" cy="270" r="7" fill="#ff8a1f" filter="url(#neonSoft)"/>
      <text x="718" y="278" font-size="22" font-weight="600" fill="#ffe3c2">waiting on you</text>
    </g>
    <g class="pill p3">
      <rect x="940" y="244" width="250" height="52" rx="26" fill="#0a1a12" stroke="#00ff88" stroke-width="1.5" filter="url(#neonSoft)"/>
      <circle cx="968" cy="270" r="7" fill="#00ff88" filter="url(#neonSoft)"/>
      <text x="986" y="278" font-size="22" font-weight="600" fill="#caffe4">finished</text>
    </g>

    <!-- blended tricolour bar: glow underlay + crisp line -->
    <rect class="hum" x="0" y="344" width="1280" height="16" fill="url(#tri)" filter="url(#bar)"/>
    <rect x="0" y="348" width="1280" height="12" fill="url(#tri)"/>
  </g>
</svg>
